project_id = "diabuddy"

# The cron job authenticates with a secret API key on the `apikey` header,
# which the platform JWT check cannot validate; @supabase/server does it instead.
[functions.send-glucose-reminders]
verify_jwt = false

# OAuth discovery for MCP clients carries no token; @supabase/server verifies every other request.
[functions.mcp]
verify_jwt = false
